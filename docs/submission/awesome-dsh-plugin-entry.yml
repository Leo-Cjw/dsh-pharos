# awesome-dsh-plugin 收录条目（投稿文件）
# 提交方式：fork awesome-dsh-plugin → 新增 data/plugins/Leo-Cjw__dsh-pharos.yml → 重新生成 README → PR

url: https://github.com/Leo-Cjw/dsh-pharos
name: Leo-Cjw/dsh-pharos
category: notify
description:
  en: 'Desktop notifier for DeepSeek Harness: when the agent needs your input (approval, plan review or question) it shows a system notification with the tool, reason or question text, plays a distinct chime and pins a "🔔 needs you" tab-title marker — re-alerting once after 10 minutes if you still have not acted; when a reply finishes in the background it alerts with a per-run duration summary, clicking a notification refocuses DSH and opens that conversation, and if notifications are unavailable the tab title blinks for 6 seconds as a fallback; sound volume, click-to-focus, quiet rules (silent for the session you are looking at) and every toggle are configurable from the console, zero dependencies and no host-side logic.'
  zh: 'DSH 桌面端守望提醒：模型需要你操作（审批 / 方案确认 / 提问）时弹出系统通知（正文带工具名、原因或问题文本）、播放专属提示音并在标签页钉上“🔔 需要你”标记，10 分钟未处理会补发一次（标注仍未处理）；回复在后台完成时通知并附每次运行耗时小结；点击通知聚焦 DSH 并打开对应会话；系统通知不可用时标签页 ⏳ 闪烁 6 秒兜底。音量、点击聚焦、静音规则（当前正看的会话只留标记不打扰）、完成提醒仅后台等均可从控制台配置，零依赖、宿主侧零逻辑。'