name: Leo-Cjw/dsh-pharos
category: notify
description:
  en: 'Alerts you when the DeepSeek Harness agent needs your input or a reply finishes in the background — system notification, chime and tab-title marker, a one-shot re-alert for unanswered requests, a duration summary, and a title-blink fallback when notifications are unavailable.'
  zh: 'DSH 桌面端守望提醒：模型需要你操作（审批 / 方案确认 / 提问）或回复在后台完成时，系统通知、提示音与标题标记提醒你；未处理待办 10 分钟后补发一次，完成通知带耗时小结，通知不可用时标题闪烁兜底。'